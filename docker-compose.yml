services:
  omnideps-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: omnideps-api:latest
    container_name: omnideps-api
    restart: unless-stopped
    command: ["omnideps", "serve", "--port", "3000"]
    # Internal port 3000 mapped to host 127.0.0.1:5004 (demo series 5000)
    ports:
      - "127.0.0.1:5004:3000"
    environment:
      - RUST_LOG=warn

  omnideps-website:
    build:
      context: ./website
      dockerfile: Dockerfile
    image: omnideps-website:latest
    container_name: omnideps-website
    restart: unless-stopped
    # Documentation site and interactive demo UI mapped to host 127.0.0.1:5003
    ports:
      - "127.0.0.1:5003:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - OMNIDEPS_BACKEND_URL=http://omnideps-api:3000
    depends_on:
      - omnideps-api
