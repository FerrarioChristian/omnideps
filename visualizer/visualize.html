<!DOCTYPE html>
<html>
<head>
    <title>Language Agnostic Analyzer - Dependency Graph</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <script src="https://unpkg.com/layout-base/layout-base.js"></script>
    <script src="https://unpkg.com/cose-base/cose-base.js"></script>
    <script src="https://unpkg.com/cytoscape-fcose/cytoscape-fcose.js"></script>
    <link rel="stylesheet" href="style.css" type="text/css" /> 
</head>
<body>
    <div id="info">
        <div id="status">Loading...</div>
        <select id="graph-selector" style="display: none;"></select>
    </div>

    <a href="legend.html" target="_blank" class="legendBtn">?</a>
    <div id="cy"></div>

    <script type="module">
        import style from './cytoscape_style.js';
        let cy = null;

        function loadGraph(jsonPath) {
            document.getElementById('status').innerText = "Caricamento: " + jsonPath;
            
            const fetchPath = jsonPath.startsWith('/') ? jsonPath : '/' + jsonPath;
            
            fetch(fetchPath)
                .then(res => res.json())
                .then(elements => {
                    document.getElementById('status').innerText =  jsonPath;
                    
                    if (cy) {
                        cy.destroy();
                    }

                    cy = cytoscape({
                        container: document.getElementById('cy'),
                        elements: elements,
                        style: style,
                        layout: {
                            name: 'fcose',
                            quality: "proof",
                            randomize: true,
                            animate: true,
                            animationDuration: 1000,
                            fit: true,
                            padding: 30,
                            nodeDimensionsIncludeLabels: true,
                            uniformNodeDimensions: false,
                            packComponents: true,
                            step: "all",
                            idealEdgeLength: edge => 50,
                            edgeElasticity: edge => 0.45,
                            nodeRepulsion: node => 4500,
                            gravity: 0.25,
                            gravityRange: 3.8,
                            gravityCompound: 1.0,
                            gravityRangeCompound: 1.5,
                        }
                    });

                    // Visual Debugging Interattivo
                    cy.on('tap', 'node', function(e) {
                        var node = e.target;
                        // Prendi il vicinato (archi in entrata, archi in uscita, e i nodi collegati a 1 passo)
                        var neighborhood = node.closedNeighborhood();
                        
                        // Per non perdere il contesto visivo della scatola, includiamo i parent e i figli
                        var context = neighborhood.union(node.ancestors()).union(node.descendants());
                        
                        cy.elements().addClass('dimmed');
                        context.removeClass('dimmed');
                    });

                    cy.on('tap', function(e) {
                        if (e.target === cy) {
                            cy.elements().removeClass('dimmed');
                        }
                    });
            })
            .catch(err => {
                document.getElementById('status').innerText = "Error: Load graph failed for " + jsonPath;
                console.error(err);
            });
        }

        fetch('/api/list_graphs')
            .then(res => res.json())
            .then(files => {
                const selector = document.getElementById('graph-selector');
                if (files.length === 0) {
                    document.getElementById('status').innerText = "No graphs found. Please run the analyzer first.";
                    return;
                }
                
                files.forEach(f => {
                    const option = document.createElement('option');
                    option.value = f;
                    const filename = f.split('/').pop().replace("cyto_", "");
                    option.innerText = filename;
                    selector.appendChild(option);
                });
                
                selector.style.display = 'block';
                
                loadGraph(files[0]);
                
                selector.addEventListener('change', (e) => {
                    loadGraph(e.target.value);
                });
            })
            .catch(err => {
                document.getElementById('status').innerText = "Error: Failed to load graph list.";
                console.error(err);
            });
    </script>
</body>
</html>
