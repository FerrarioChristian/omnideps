[package]
name = "omnideps"
version = "0.1.0"
edition = "2024"
description = "A language-agnostic architectural dependency analyzer and visualizer based on tree-sitter"
authors = ["Christian Ferrario <chri.fer.emi@gmail.com>"]
license = "MIT"
repository = "https://github.com/FerrarioChristian/omnideps"
readme = "README.md"
keywords = ["analyzer", "dependency-graph", "tree-sitter", "architecture", "visualization"]
categories = ["development-tools"]
default-run = "omnideps"

# Important: We must explicitly include these files/folders because
# visualizer-svelte/build is ignored by git, but we need it for rust-embed!
include = [
    "src/**/*",
    "visualizer-svelte/build/**/*",
    "docs/**/*",
    "tests/**/*",
    "Cargo.toml",
    "README.md"
]

[dependencies]
tree-sitter = "0.26.8"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.24"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
anyhow = "1.0"
serde_yaml = "0.9.34"
csv = "1.3"
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
rust-embed = "8.12.0"
mime_guess = "2.0.5"
open = "5.4.2"
tempfile = "3.27.0"
log = "0.4.34"
env_logger = "0.11.11"

[[bin]]
name = "omnideps"
path = "src/main.rs"
